apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: will42
  name: will42
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: will42
  template:
    metadata:
      labels:
        app: will42
    spec:
      containers:
      - image: wil42/playground:v1
        name: will42
        ports:
        - containerPort: 8888


---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: will42
  name: will42
  namespace: dev
spec:
  ports:
  - name: 8085-8888
    nodePort: 30080
    port: 8085
    protocol: TCP
    targetPort: 8888
  selector:
    app: will42
  type: NodePort


---


